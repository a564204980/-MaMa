<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>爸妈睡着以后 · 碰撞编辑器</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10161c;color:#dce5eb;font:14px 'Microsoft YaHei',sans-serif}header{padding:16px 22px;border-bottom:1px solid #33424e;display:flex;align-items:center;gap:18px}h1{font-size:19px;margin:0}header span{color:#99adbb;font-size:12px}button,select,input{background:#24323d;color:#ecf2f5;border:1px solid #465968;border-radius:6px;padding:9px;font:inherit}button{cursor:pointer}button:hover{background:#344c5d}button.active{background:#286778;border-color:#7bc9d8}button:disabled{opacity:.4;cursor:default}.primary{background:#286778}main{display:grid;grid-template-columns:240px 1fr;height:calc(100vh - 67px)}aside{padding:16px;overflow:auto;border-right:1px solid #33424e}h2{font-size:13px;color:#a4b9c8;margin:20px 0 10px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tools button{font-size:13px}.row{display:flex;gap:7px;align-items:center;margin:10px 0}.row input[type=range]{width:130px;padding:0}p{font-size:12px;line-height:1.8;color:#9bb0bf}#stage{position:relative;min-width:0;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}#status{position:absolute;bottom:14px;left:16px;right:16px;background:#111d29e8;border:1px solid #3b5264;border-radius:6px;padding:10px;pointer-events:none;font-size:13px}#list{width:100%;height:165px;font-size:12px}#selection{font-size:12px;line-height:1.8;overflow-wrap:anywhere}.legend{font-size:12px;line-height:1.9}.red{color:#ff6577}.orange{color:#ffbd73}.green{color:#8dd5ba}#save{margin-left:auto}label{font-size:12px}#coords{color:#9bb0bf;font-size:12px}
</style>
<header><h1>爸妈睡着以后 / 碰撞编辑</h1><span id="dirty">正在加载…</span><button id="save" class="primary">保存并构建游戏</button><button id="export">导出备份</button></header>
<main><aside><div class="tools"><button data-tool="select" class="active">选择 / 拖动</button><button data-tool="rect">画矩形</button><button data-tool="poly">画多边形</button><button data-tool="probe">检查通行</button></div>
<div class="row"><label>新增类型</label><select id="kind"><option value="wall">墙体</option><option value="furniture">家具</option></select></div>
<p id="help">点击区域选择，拖动内部移动；拖动白色顶点改变形状。重叠区域可在下方列表选择。</p>
<div class="tools"><button id="finish">完成多边形</button><button id="cancel">取消绘制</button><button id="undo">撤销</button><button id="redo">重做</button><button id="delete">删除选中</button><button id="fit">完整背景</button></div>
<button id="editDoors">调整门的位置</button><p>绿色区域为门，可在选择模式拖动、拖四角改大小；也可在区域列表按门名选择。</p><h2>查看</h2><div class="row"><button id="minus">−</button><span id="zoom">100%</span><button id="plus">＋</button></div>
<div class="row"><label>碰撞透明度</label><input id="opacity" type="range" min="0" max="65" value="24"></div>
<div class="row"><label><input id="floors" type="checkbox"> 显示地图外边界</label></div><div class="row"><label><input id="doorsClosed" type="checkbox"> 检查时按关门计算</label></div>
<p>滚轮缩放；按住空格或鼠标中键拖动画面。多边形逐点点击，Enter 完成、Esc 取消。Delete 删除选中区域。</p>
<h2>区域 <span id="count"></span></h2><select id="list" size="7"></select><div id="selection">尚未选择</div>
<h2>图例</h2><div class="legend"><span class="red">■ 墙体</span>　<span class="orange">■ 家具</span><br><span class="green">▱ 可编辑的门（关门时阻挡）</span></div><p>圈选的是不能走的区域。门口要留空；只有手画区域、关闭的门和地图外边界会阻挡。通行探针使用人物碰撞尺寸，不代表人物整张图的遮挡。</p><div id="coords"></div>
</aside><section id="stage"><canvas id="canvas"></canvas><div id="status">正在加载完整背景和当前碰撞…</div></section></main><script type="module" src="/editor.js"></script></html>
